name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -O -m unittest discover -s tests -v
      - run: python3 tools/check_public.py
      - run: python3 tools/fetch_sources.py
      - run: python3 tools/build_loader.py
